# ============================================================
#  壁纸桌面时钟 配置文件
#  布局相关项由程序自动写入，无需手工编辑
# ============================================================

# 背景图（相对本目录或绝对路径）
image=wallpaper.jpg

# 显示位置：all = 全部显示器 / 0 = 显示器1 / 1 = 显示器2
displays=all

# 时间格式：use12h=0 -> HH:mm / use12h=1 -> hh:mm
use12h=0
dateformat=yyyy.MM.dd

# 文字颜色与阴影
color=#F2F2F2
shadow=1

# 右下角柔和压暗（烘焙进桌面壁纸）
vignette=1
vignette_alpha=78

# 显示开关
showdate=1
showweek=1
showseconds=1

# 窗口内部相对布局（一般不用改）
rel_right=0.831
rel_clock_y=0.323
rel_date_y=0.695
gap_seconds=14
gap_week=26
seconds_dy=10

# 字体与基础字号（像素，实际字号 = 基础字号 x 缩放）
font_clock=Bahnschrift
size_clock=64
font_date=Consolas
size_date=18
font_week=SimHei
size_week=18
font_seconds=Consolas
size_seconds=18
